name: Testes de API

on:
  push:
  workflow_dispatch:

jobs:
  testes-api:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Instalar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalar o Newman e o gerador de relatório
        run: npm install -g newman newman-reporter-htmlextra

      - name: Rodar a coleção de testes
        run: newman run colecao.json -r cli,htmlextra --reporter-htmlextra-export relatorio.html

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-newman
          path: relatorio.html