# Atenção: no YAML a indentação é feita com ESPAÇOS, nunca com TAB.
name: Testes de API

on: [ ____ , workflow_dispatch ]      # LACUNA 1: qual evento dispara o pipeline a cada envio de código?

jobs:
  testes-api:
    runs-on: ____                     # LACUNA 2: qual máquina do GitHub roda o job? (Linux, versão mais recente)
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Instalar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Instalar o Newman
        run: npm install -g newman

      - name: Rodar a coleção de testes
        run: newman run ____          # LACUNA 3: qual arquivo o Newman deve rodar?
